# For `docker compose watch`: while you edit code, the files you save are copied into the running containers,
# and the services that need it restart by themselves.
#
#     docker compose watch
#
# `docker compose` loads this file next to docker-compose.yml on its own, but ONLY when you do not name
# files with -f or COMPOSE_FILE. The production command (docker-compose.yml + docker-compose.prod.yml)
# therefore never sees these rules, and a production container never has files copied into it.

# The rules, written once and used by the services below.
#   sync          copy the saved file into the container (the web server reads PHP fresh on every request)
#   sync+restart  copy it, then restart the container (a worker keeps the code it started with in memory)
#   rebuild       build the image again and replace the container (new packages, a new Dockerfile)
# Files and folders that are not listed here (vendor, storage, .env, ...) are never copied.
x-watch-rules:
  sync-app: &sync-app {action: sync, path: ./app, target: /app/app}
  sync-bootstrap: &sync-bootstrap {action: sync, path: ./bootstrap, target: /app/bootstrap, ignore: [cache/]}
  sync-config: &sync-config {action: sync, path: ./config, target: /app/config}
  sync-database: &sync-database {action: sync, path: ./database, target: /app/database}
  sync-routes: &sync-routes {action: sync, path: ./routes, target: /app/routes}
  # So that `docker compose exec app ./vendor/bin/pest` runs the tests you just saved.
  sync-tests: &sync-tests {action: sync, path: ./tests, target: /app/tests}
  sync-docs: &sync-docs {action: sync, path: ./docs, target: /app/docs}
  sync-phpunit: &sync-phpunit {action: sync, path: ./phpunit.xml, target: /app/phpunit.xml}
  sync-readme: &sync-readme {action: sync, path: ./README.md, target: /app/README.md}
  sync-env-example: &sync-env-example {action: sync, path: ./.env.example, target: /app/.env.example}
  restart-app: &restart-app {action: sync+restart, path: ./app, target: /app/app}
  restart-bootstrap: &restart-bootstrap {action: sync+restart, path: ./bootstrap, target: /app/bootstrap, ignore: [cache/]}
  restart-config: &restart-config {action: sync+restart, path: ./config, target: /app/config}
  rebuild-composer-json: &rebuild-composer-json {action: rebuild, path: ./composer.json}
  rebuild-composer-lock: &rebuild-composer-lock {action: rebuild, path: ./composer.lock}
  rebuild-dockerfile: &rebuild-dockerfile {action: rebuild, path: ./Dockerfile}
  rebuild-docker: &rebuild-docker {action: rebuild, path: ./docker, ignore: [postgres/, livekit/]}

services:
  # The web server: no restart, because PHP is read again on every request.
  app:
    develop:
      watch:
        - *sync-app
        - *sync-bootstrap
        - *sync-config
        - *sync-database
        - *sync-routes
        - *sync-tests
        - *sync-docs
        - *sync-phpunit
        - *sync-readme
        - *sync-env-example
        - *rebuild-composer-json
        - *rebuild-composer-lock
        - *rebuild-dockerfile
        - *rebuild-docker

  # Restarts only when the settings change: it does not run your code, and every restart would
  # disconnect everyone who is connected.
  reverb:
    develop:
      watch:
        - *restart-config
        - *sync-app
        - *sync-bootstrap
        - *sync-database
        - *sync-routes
        - *rebuild-composer-json
        - *rebuild-composer-lock
        - *rebuild-dockerfile
        - *rebuild-docker

  # Keeps the code it started with in memory, so it restarts when that code changes.
  queue:
    develop:
      watch:
        - *restart-app
        - *restart-bootstrap
        - *restart-config
        - *sync-database
        - *sync-routes
        - *rebuild-composer-json
        - *rebuild-composer-lock
        - *rebuild-dockerfile
        - *rebuild-docker

  # Needs no restart: every minute it starts a new PHP process for the jobs that are due.
  scheduler:
    develop:
      watch:
        - *sync-app
        - *sync-bootstrap
        - *sync-config
        - *sync-database
        - *sync-routes
        - *rebuild-composer-json
        - *rebuild-composer-lock
        - *rebuild-dockerfile
        - *rebuild-docker
