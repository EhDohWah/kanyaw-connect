# The whole app with one command:
#
#     docker compose up -d --build
#
# Services:  postgres, redis       data
#            migrate               runs once: updates the database (and adds demo people if it is empty)
#            app                   the API, http://localhost:8000
#            reverb                live updates (websockets), ws://localhost:8080
#            queue                 sends the live events and push notifications in the background
#            scheduler             runs the clean-up jobs and marks people offline
#            livekit               video calls
#            test                  only when asked for: docker compose run --rm test
#
# Settings: copy .env.example to .env and change what you need. Every setting has a working default,
# so the file is optional. The README explains all of them.
#
# While you edit code, run `docker compose watch` (after `docker compose up -d --build`): the files you
# save are copied into the running containers, and the services that need it restart by themselves.
name: kanyaw-connect

x-php: &php
  image: kanyaw-connect:dev
  build:
    context: .
    target: development
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &php-environment
    # How the containers find each other. These always win over the same names in .env, because
    # .env is usually written for running the app directly on your own machine (DB_HOST=127.0.0.1).
    APP_NAME: ${APP_NAME:-Karen Connect}
    # A public key so that the stack starts with no setup. It is only used when APP_KEY in .env is
    # missing or empty. Never run a real server with it: docker-compose.prod.yml requires your own.
    APP_KEY: &dev-app-key ${APP_KEY:-base64:6yLKxj44xO5HmzNTs0jgCq8yX0tqY7KRfRalAtOvSK0=}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_URL: ${APP_URL:-http://localhost:8000}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: ${DB_DATABASE:-kanyaw_connect}
    DB_USERNAME: ${DB_USERNAME:-kanyaw}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: "null"
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: array
    BROADCAST_CONNECTION: reverb
    # Laravel hands live events to the Reverb container. Browsers connect to the published port
    # instead: REVERB_PORT in .env is the port on your machine.
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: "8080"
    REVERB_APP_ID: ${REVERB_APP_ID:-100001}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-local-dev-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-dev-secret}
    # LIVEKIT_URL is what browsers connect to. LIVEKIT_HOST is how this server reaches LiveKit.
    LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
    LIVEKIT_HOST: http://livekit:7880
    LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
    LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret-secret-secret-secret-secret-secret}
    # Logs go to `docker compose logs`.
    LOG_CHANNEL: stderr

# The rules of `docker compose watch`, written once and used by the services further down.
#   sync          copy the saved file into the container (the web server reads PHP fresh on every request)
#   sync+restart  copy it, then restart the container (a worker keeps the code it started with in memory)
#   rebuild       build the image again and replace the container (new packages, a new Dockerfile)
# Files and folders that are not listed here (vendor, storage, .env, ...) are never copied.
x-watch-rules:
  sync-app: &sync-app {action: sync, path: ./app, target: /app/app}
  sync-bootstrap: &sync-bootstrap {action: sync, path: ./bootstrap, target: /app/bootstrap, ignore: [cache/]}
  sync-config: &sync-config {action: sync, path: ./config, target: /app/config}
  sync-database: &sync-database {action: sync, path: ./database, target: /app/database}
  sync-routes: &sync-routes {action: sync, path: ./routes, target: /app/routes}
  # So that `docker compose exec app ./vendor/bin/pest` runs the tests you just saved.
  sync-tests: &sync-tests {action: sync, path: ./tests, target: /app/tests}
  sync-docs: &sync-docs {action: sync, path: ./docs, target: /app/docs}
  sync-phpunit: &sync-phpunit {action: sync, path: ./phpunit.xml, target: /app/phpunit.xml}
  sync-readme: &sync-readme {action: sync, path: ./README.md, target: /app/README.md}
  sync-env-example: &sync-env-example {action: sync, path: ./.env.example, target: /app/.env.example}
  restart-app: &restart-app {action: sync+restart, path: ./app, target: /app/app}
  restart-bootstrap: &restart-bootstrap {action: sync+restart, path: ./bootstrap, target: /app/bootstrap, ignore: [cache/]}
  restart-config: &restart-config {action: sync+restart, path: ./config, target: /app/config}
  rebuild-composer-json: &rebuild-composer-json {action: rebuild, path: ./composer.json}
  rebuild-composer-lock: &rebuild-composer-lock {action: rebuild, path: ./composer.lock}
  rebuild-dockerfile: &rebuild-dockerfile {action: rebuild, path: ./Dockerfile}
  rebuild-docker: &rebuild-docker {action: rebuild, path: ./docker, ignore: [postgres/, livekit/]}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kanyaw_connect}
      POSTGRES_USER: ${DB_USERNAME:-kanyaw}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # Only reachable from your own machine (for a database tool such as DBeaver or TablePlus).
      - "127.0.0.1:${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # Write to disk as it goes, so waiting background jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once and stops. The services below wait for it to finish.
  migrate:
    <<: *php
    restart: "no"
    command: ["bootstrap-db.sh"]
    environment:
      <<: *php-environment
      # Add demo people and chats to an EMPTY database (user1@example.com ... user5@example.com,
      # password "password"). Set to false in .env to start with nothing.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *php
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - storage:/app/storage
      - caddy-data:/data
      - caddy-config:/config
    develop:
      watch:
        - *sync-app
        - *sync-bootstrap
        - *sync-config
        - *sync-database
        - *sync-routes
        - *sync-tests
        - *sync-docs
        - *sync-phpunit
        - *sync-readme
        - *sync-env-example
        - *rebuild-composer-json
        - *rebuild-composer-lock
        - *rebuild-dockerfile
        - *rebuild-docker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  reverb:
    <<: *php
    command: ["php", "artisan", "reverb:start"]
    ports:
      - "${REVERB_PORT:-8080}:8080"
    # Restarts only when the settings change: it does not run your code, and every restart would
    # disconnect everyone who is connected.
    develop:
      watch:
        - *restart-config
        - *sync-app
        - *sync-bootstrap
        - *sync-database
        - *sync-routes
        - *rebuild-composer-json
        - *rebuild-composer-lock
        - *rebuild-dockerfile
        - *rebuild-docker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  queue:
    <<: *php
    # Starts over every hour, so a long-running worker cannot slowly fill its memory.
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]
    stop_grace_period: 60s
    volumes:
      - storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    develop:
      watch:
        - *restart-app
        - *restart-bootstrap
        - *restart-config
        - *sync-database
        - *sync-routes
        - *rebuild-composer-json
        - *rebuild-composer-lock
        - *rebuild-dockerfile
        - *rebuild-docker

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Needs no restart: every minute it starts a new PHP process for the jobs that are due.
    develop:
      watch:
        - *sync-app
        - *sync-bootstrap
        - *sync-config
        - *sync-database
        - *sync-routes
        - *rebuild-composer-json
        - *rebuild-composer-lock
        - *rebuild-dockerfile
        - *rebuild-docker

  livekit:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    extra_hosts:
      # Only needed when the app runs on your machine instead of in Docker (see LIVEKIT_WEBHOOK_URL in the README).
      - "host.docker.internal:host-gateway"
    environment:
      # LiveKit's whole configuration, written here instead of in a file so that its key and secret
      # come from the same place as the app's (LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env).
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          # The address browsers are told to send media to. 127.0.0.1 works for a browser on this
          # machine. For a phone on your network, use this machine's address on that network.
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
        keys:
          ${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret-secret-secret-secret-secret-secret}
        # LiveKit tells the API who joined and left. This is how a room becomes active and how seats are freed.
        webhook:
          api_key: ${LIVEKIT_API_KEY:-devkey}
          urls:
            - ${LIVEKIT_WEBHOOK_URL:-http://app/api/v1/webhooks/livekit}
    ports:
      - "7880:7880"        # signalling (websocket)
      - "7881:7881"        # media over TCP, for networks that block UDP
      - "7882:7882/udp"    # media over UDP: every call goes through this one port

  # Not started by `up`. Run the tests with:  docker compose run --rm test
  # It has no env_file on purpose: the tests must not pick up your own settings. They use their own
  # database (kanyaw_connect_test), never the one the app uses.
  test:
    image: kanyaw-connect:dev
    build:
      context: .
      target: development
    profiles: ["test"]
    restart: "no"
    command: ["./vendor/bin/pest"]
    environment:
      APP_KEY: *dev-app-key
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${DB_USERNAME:-kanyaw}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  storage:
  caddy-data:
  caddy-config:
