<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the bottom bar respect the phone's home-indicator area -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Private chat, community feed and video meetings for the Karen community." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Noto Sans Myanmar, for Burmese and S'gaw Karen. Loaded without blocking the first paint (media="print"
      switched to "all" once it has arrived); until then the text shows in a system font (font-display: swap).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600&display=swap"
      />
    </noscript>

    <title>Kanyaw Connect</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Kanyaw Connect needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
