# LiveKit server config for LOCAL DEVELOPMENT.
# The key/secret must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env.
# For production (public IP, TLS, built-in TURN) see the README.
port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false

keys:
  devkey: secret-secret-secret-secret-secret-secret

# LiveKit reports who joined and left to the API, which is the source of truth for room membership.
# The API listens on the host (php artisan serve, port 8000); host.docker.internal reaches the host
# from inside the container (see extra_hosts in docker-compose.yml).
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:8000/api/v1/webhooks/livekit
