; PHP settings for every PHP process in the image: the web server, Reverb, the queue worker and the scheduler.

memory_limit = 256M
expose_php = Off

; Errors go to the container log (docker compose logs), never into responses.
display_errors = Off
log_errors = On

; Chat attachments are limited to 25 MB (config/chat.php). Leave room for the form around the file.
upload_max_filesize = 26M
post_max_size = 30M
max_execution_time = 60

date.timezone = UTC

; Laravel opens thousands of small files; these caches make that cheap.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
; Look for a changed file on every request, so a saved change shows at once (production.ini turns the check off).
opcache.revalidate_freq = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
